<text x="685.6666666666667" y="357" font-size="16">46 с</text>
<text x="24" y="410" font-size="14">Подготовительные запуски исключены; сравнение выполнено внутри каждого показателя.</text>
<text x="24" y="438" font-size="14">Источник: ci-measurements.csv. Повторные запуски одной версии кода при готовом кеше.</text>
